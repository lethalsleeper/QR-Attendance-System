# Project-wide Gradle settings.
# Memory is capped for laptops with ~6 GB RAM. On a machine with 16 GB+ you can raise
# -Xmx to 4g and kotlin.daemon.jvmargs to 2g for faster builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Firebase Emulator Suite (debug builds only)
# true  = the debug app talks to the FREE local emulators (start-emulators.bat).
# false = the debug app talks to your real Firebase project in the cloud.
# Release builds always use the real Firebase project.
#
# firebaseEmulatorHost = the laptop's address as seen by the phones.
#   192.168.137.1 -> phones connected to the laptop's Windows "Mobile hotspot"
#                    (Windows always gives the hotspot this address). Default.
#   10.0.2.2      -> an Android Studio emulator running on the same laptop
# After changing it, rebuild the app with build-app.bat and reinstall it on the phones.
# ---------------------------------------------------------------------------
useFirebaseEmulator=true
firebaseEmulatorHost=192.168.137.1
